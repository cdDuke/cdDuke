name: Snake

# Draws the contribution graph as a snake animation and publishes it to the
# `output` branch, which the README embeds.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7c5cff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#d7ff3d&color_dots=#161b22,#2b3a14,#4d6b1a,#86b324,#d7ff3d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
